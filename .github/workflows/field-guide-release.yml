name: Complete field guide release checks
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/content/field-guide/**'
      - 'src/pages/guides/software-engineering/**'
      - 'src/data/field-guide-revisions.ts'
      - 'src/layouts/FieldGuidePilotLayout.astro'
      - 'src/components/SoftwareEngineeringGuideIndex.astro'
      - 'scripts/test-field-guide-*.py'
      - 'experiments/field-guide-approved-source-sha256.json'
      - '.github/workflows/field-guide-release.yml'
  push:
    branches: [main]
    paths:
      - 'src/content/field-guide/**'
      - 'src/pages/guides/software-engineering/**'
      - 'src/data/field-guide-revisions.ts'
      - 'src/layouts/FieldGuidePilotLayout.astro'
      - 'src/components/SoftwareEngineeringGuideIndex.astro'
      - 'scripts/test-field-guide-*.py'
      - 'experiments/field-guide-approved-source-sha256.json'
      - '.github/workflows/field-guide-release.yml'
permissions:
  contents: read
jobs:
  complete-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - name: Test the seven approved articles
        run: |
          python scripts/test-field-guide-pilots.py --require-dotnet
          python scripts/test-field-guide-solid.py --require-dotnet
      - name: Require and execute all 199 new articles
        run: python scripts/test-field-guide-rewrite.py --complete --require-dotnet
      - name: Build the real website with no legacy article fallback
        run: npm run build
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Verify all 206 canonical pages in Chromium
        run: python scripts/test-field-guide-release.py
      - name: Verify every published replacement after deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/test-field-guide-release.py --origin https://roughatsea.com
      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-field-guide-release-evidence
          retention-days: 14
          path: |
            verification/field-guide-release
            verification/field-guide-rewrite/examples.json
            experiments/field-guide-approved-source-sha256.json
          if-no-files-found: error
