name: Publish Wake pilot

on:
  push:
    branches:
      - wake-pilot
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the completed pilot branch
        uses: actions/checkout@v4
        with:
          ref: wake-pilot
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate data and build the site
        run: npm run build

      - name: Remove one-time rollout files and generated exports
        run: |
          rm -f wake-probe.txt
          rm -f .github/workflows/publish-wake-pilot.yml
          rm -f public/wake/data.json public/wake/data.csv

      - name: Publish the validated pilot to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish The Wake pilot"
          git push origin HEAD:main
