name: Waifu guardrails

on:
  pull_request:
    paths:
      - 'src/content/waifu/**'
      - 'public/images/waifu/**'
      - 'src/pages/waifu/**'
      - 'src/content.config.ts'
      - 'scripts/validate-waifu.mjs'
      - 'scripts/waifu-publication-bridge.mjs'
      - 'automation/daily-waifu.md'
      - 'automation/waifu-publication-bridge.md'
      - '.github/workflows/waifu-guardrails.yml'
      - '.github/workflows/waifu-publication-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'src/content/waifu/**'
      - 'public/images/waifu/**'
      - 'src/pages/waifu/**'
      - 'src/content.config.ts'
      - 'scripts/validate-waifu.mjs'
      - 'scripts/waifu-publication-bridge.mjs'
      - 'automation/daily-waifu.md'
      - 'automation/waifu-publication-bridge.md'
      - '.github/workflows/waifu-guardrails.yml'
      - '.github/workflows/waifu-publication-bridge.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/waifu-publication-bridge.mjs self-test
      - run: node scripts/validate-waifu.mjs
      - run: npm run build
