name: Field guide pilot examples
on:
  pull_request:
    paths:
      - 'src/pages/guides/software-engineering/pilot/**'
      - 'src/layouts/FieldGuidePilotLayout.astro'
      - 'scripts/test-field-guide-pilots.py'
      - '.github/workflows/field-guide-pilots.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  displayed-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test the displayed Python and C# snippets
        run: python scripts/test-field-guide-pilots.py --require-dotnet
