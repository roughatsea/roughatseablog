name: Repair and verify Cosmic Currents build

on:
  push:
    branches:
      - automation/cosmic-currents-build-20260829

permissions:
  contents: write

jobs:
  repair-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply TypeScript 6 typed-array repair
        run: |
          python <<'PY'
          from pathlib import Path

          renderer_path = Path('src/components/cosmic-currents/CosmicCurrentsRenderer.ts')
          renderer = renderer_path.read_text()
          renderer_replacements = {
              'function perspective(fovRadians: number, aspect: number, near: number, far: number): Float32Array {':
                  'function perspective(fovRadians: number, aspect: number, near: number, far: number): Float32Array<ArrayBuffer> {',
              'function lookAt(eye: Vec3, target: Vec3): Float32Array {':
                  'function lookAt(eye: Vec3, target: Vec3): Float32Array<ArrayBuffer> {',
              'function multiply(a: Float32Array, b: Float32Array): Float32Array {':
                  'function multiply(\n  a: Float32Array<ArrayBuffer>,\n  b: Float32Array<ArrayBuffer>,\n): Float32Array<ArrayBuffer> {',
          }
          for old, new in renderer_replacements.items():
              count = renderer.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one renderer match for {old!r}; found {count}.')
              renderer = renderer.replace(old, new)
          renderer_path.write_text(renderer)

          model_path = Path('src/data/cosmicCurrentsModel.ts')
          model = model_path.read_text()
          model_replacements = {
              '  positions: Float32Array;': '  positions: Float32Array<ArrayBuffer>;',
              '  colors: Float32Array;': '  colors: Float32Array<ArrayBuffer>;',
              '  sizes: Float32Array;': '  sizes: Float32Array<ArrayBuffer>;',
          }
          for old, new in model_replacements.items():
              count = model.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one model match for {old!r}; found {count}.')
              model = model.replace(old, new)
          model_path.write_text(model)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build Astro site
        run: npm run build
      - name: Commit the verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cosmic-currents/CosmicCurrentsRenderer.ts src/data/cosmicCurrentsModel.ts
          git commit -m "fix Cosmic Currents typed arrays for TypeScript 6"
          git push
