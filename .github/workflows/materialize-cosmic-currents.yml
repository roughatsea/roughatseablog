name: Materialize Cosmic Currents source

on:
  push:
    branches:
      - automation/cosmic-currents-materialize-20260829

permissions:
  contents: write

concurrency:
  group: cosmic-currents-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand verified source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/components/cosmic-currents
          gzip -dc .cosmic-transport/CosmicCurrentsExperience.css.gz > src/components/cosmic-currents/CosmicCurrentsExperience.css
          gzip -dc .cosmic-transport/CosmicCurrentsExperience.tsx.gz > src/components/cosmic-currents/CosmicCurrentsExperience.tsx
          gzip -dc .cosmic-transport/CosmicCurrentsRenderer.ts.gz > src/components/cosmic-currents/CosmicCurrentsRenderer.ts

          test "$(git hash-object src/components/cosmic-currents/CosmicCurrentsExperience.css)" = "2b5abc3ec48d8a7fe75c1d9f025a27de980c34d8"
          test "$(git hash-object src/components/cosmic-currents/CosmicCurrentsExperience.tsx)" = "94a084360f1b12b1fe3daa0d0b879451d53bbefd"
          test "$(git hash-object src/components/cosmic-currents/CosmicCurrentsRenderer.ts)" = "68785ebb10347f81b443623f11a6cda88d507251"

          rm -rf .cosmic-transport
          rm -f .github/workflows/materialize-cosmic-currents.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize Cosmic Currents source"
          git push origin HEAD:${GITHUB_REF_NAME}
