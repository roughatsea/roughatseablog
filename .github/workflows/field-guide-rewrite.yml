name: Field guide rewrite checks
on:
  pull_request:
    paths:
      - 'src/content/field-guide/**'
      - 'src/data/field-guide-revisions.ts'
      - 'src/pages/guides/software-engineering/**'
      - 'scripts/test-field-guide-rewrite.py'
      - '.github/workflows/field-guide-rewrite.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guide-rewrite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  examples-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: python scripts/test-field-guide-pilots.py --require-dotnet
      - run: python scripts/test-field-guide-solid.py --require-dotnet
      - run: python scripts/test-field-guide-rewrite.py --require-dotnet
      - run: npm run build
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test-field-guide-rendering.py
      - name: Confirm approved SOLID pages on production
        shell: python
        run: |
          from urllib.request import Request, urlopen
          from pathlib import Path
          names = ['single-responsibility-principle', 'liskov-substitution-principle', 'interface-segregation-principle', 'dependency-inversion-principle']
          out = Path('verification/field-guide-rewrite/live'); out.mkdir(parents=True, exist_ok=True)
          for name in names:
              request = Request(f'https://roughatsea.com/guides/software-engineering/{name}/', headers={'User-Agent': 'RoughAtSea-Publication-Check'})
              with urlopen(request, timeout=30) as response:
                  html = response.read().decode()
                  assert response.status == 200
              assert 'data-publication="published"' in html, name
              assert 'Recognize it when' not in html, name
              (out / (name + '.html')).write_text(html)
              print('PASS LIVE:', name)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-guide-rewrite-evidence
          path: |
            verification/field-guide-rewrite
            src/content/field-guide
            scripts/test-field-guide-rewrite.py
          retention-days: 7
