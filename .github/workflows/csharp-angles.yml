name: Every Angle in C# checks

on:
  push:
    branches: [main]
    paths:
      - 'src/content/notes/every-angle-in-csharp.md'
      - 'scripts/test-csharp-angles.py'
  pull_request:
    paths:
      - 'src/content/notes/every-angle-in-csharp.md'
      - 'scripts/test-csharp-angles.py'
      - '.github/workflows/csharp-angles.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csharp-angles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  article-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile displayed programs and compare their stated outputs
        run: python scripts/test-csharp-angles.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build the site with the published manuscript
        run: npm run build
