  </g>
  <g fill="none" stroke="#93ff14" stroke-opacity="0.45" stroke-width="2">
    <circle cx="242" cy="286" r="20"/><circle cx="514" cy="286" r="20"/><circle cx="786" cy="286" r="20"/><circle cx="1058" cy="286" r="20"/><circle cx="1330" cy="286" r="20"/>
