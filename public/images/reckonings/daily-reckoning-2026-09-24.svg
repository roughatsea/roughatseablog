      <path d="M0 0V128M-24 18L0 0M-24 48L0 30M-24 78L0 60M-24 108L0 90" stroke-opacity="0.72"/>
      <path d="M0 64h20l10-22 20 44 20-44 20 44 20-44 20 44 20-44 10 22h20"/>
      <rect x="160" y="20" width="92" height="88" rx="8" fill="#071c2d"/>
      <circle cx="184" cy="120" r="9" fill="#071c2d"/><circle cx="228" cy="120" r="9" fill="#071c2d"/>
    </g>
