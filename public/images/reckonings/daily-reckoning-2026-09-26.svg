<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tangent lines closing in on the square root of two</title>
  <desc id="desc">A dark maritime blueprint carries a luminous cyan parabola crossing a horizontal axis above rolling contour lines. Successive magenta tangent segments descend toward one green root, while faint compass arcs and construction marks frame the numerical search.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020a14" />
      <stop offset="0.52" stop-color="#06182b" />
      <stop offset="1" stop-color="#020d19" />
    </linearGradient>
    <radialGradient id="root-glow" cx="63%" cy="69%" r="31%">
      <stop offset="0" stop-color="#93ff14" stop-opacity="0.23" />
      <stop offset="0.42" stop-color="#1493ff" stop-opacity="0.07" />
      <stop offset="1" stop-color="#020a14" stop-opacity="0" />
    </radialGradient>
    <pattern id="minor-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7db7d7" stroke-opacity="0.07" />
    </pattern>
    <pattern id="major-grid" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#7db7d7" stroke-opacity="0.12" stroke-width="1.5" />
    </pattern>
    <filter id="cyan-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="pink-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="green-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <marker id="pink-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5 0 10z" fill="#ff1493" />
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#root-glow)" />
  <rect width="1600" height="900" fill="url(#minor-grid)" />
  <rect width="1600" height="900" fill="url(#major-grid)" />

  <g fill="none" stroke="#7db7d7" stroke-opacity="0.18" stroke-width="2">
    <path d="M0 784c170-42 294-42 464 0s294 42 464 0 294-42 464 0 294 42 464 0" />
    <path d="M0 819c170-42 294-42 464 0s294 42 464 0 294-42 464 0 294 42 464 0" />
    <path d="M0 854c170-42 294-42 464 0s294 42 464 0 294-42 464 0 294 42 464 0" />
  </g>

  <g transform="translate(1270 176)" fill="none" stroke="#7db7d7" stroke-opacity="0.34">
    <circle r="106" stroke-width="2" />
    <circle r="72" stroke-dasharray="7 10" />
    <path d="M0-128V128M-128 0H128M-78-78L78 78M78-78L-78 78" />
    <path d="M0-86l16 70-16 22-16-22z" fill="#1493ff" fill-opacity="0.22" stroke="#1493ff" stroke-width="2" />
  </g>

  <g transform="translate(160 88)">
    <path d="M0 588H1280M180 0V680" fill="none" stroke="#a8d0e6" stroke-opacity="0.52" stroke-width="3" />
    <g fill="none" stroke="#a8d0e6" stroke-opacity="0.18" stroke-width="2">
      <path d="M380 60V650M580 60V650M780 60V650M980 60V650M1180 60V650" />
      <path d="M120 188H1260M120 388H1260" />
    </g>

    <path d="M500 748Q760 540 1020 61.6" fill="none" stroke="#1493ff" stroke-width="8" filter="url(#cyan-glow)" />
    <path d="M500 748Q760 540 1020 61.6" fill="none" stroke="#bfe8ff" stroke-opacity="0.72" stroke-width="2" />

    <g fill="none" stroke="#1493ff" stroke-dasharray="11 13" stroke-width="4">
      <path d="M900 588V268" />
      <path d="M700 588V548" />
      <path d="M666.667 588V586.889" />
    </g>

    <g fill="none" stroke="#ff1493" stroke-width="7" marker-end="url(#pink-arrow)" filter="url(#pink-glow)">
      <path d="M900 268L700 588" />
      <path d="M700 548L666.667 588" />
      <path d="M666.667 586.889L665.686 588" />
    </g>

    <g fill="#1493ff" stroke="#dff5ff" stroke-width="3">
      <circle cx="900" cy="268" r="9" />
      <circle cx="700" cy="548" r="9" />
      <circle cx="666.667" cy="586.889" r="9" />
    </g>
    <g fill="#ff1493" stroke="#ffd4ec" stroke-width="3">
      <circle cx="700" cy="588" r="9" />
      <circle cx="666.667" cy="588" r="9" />
      <circle cx="665.686" cy="588" r="9" />
    </g>

    <path d="M665.686 62V650" fill="none" stroke="#93ff14" stroke-dasharray="8 11" stroke-opacity="0.72" stroke-width="4" />
    <circle cx="665.686" cy="588" r="15" fill="#93ff14" filter="url(#green-glow)" />
    <circle cx="665.686" cy="588" r="5" fill="#f2ffe5" />
  </g>

  <g fill="none" stroke="#7db7d7" stroke-opacity="0.38" stroke-width="2">
    <path d="M78 126H286M78 126V334" />
    <path d="M1522 702h-208M1522 702V494" />
    <path d="M104 170h150M104 205h92M104 240h122" stroke-dasharray="10 10" />
  </g>
</svg>
