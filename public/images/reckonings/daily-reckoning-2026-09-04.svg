<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A complex number turning around a nautical plotting circle</title>
  <desc id="desc">Four luminous arrows make exact quarter-turns around a compass-like complex plane while an acid-green wake traces a square path across a dark maritime blueprint.</desc>
  <defs>
    <radialGradient id="sea" cx="52%" cy="45%" r="72%">
      <stop offset="0" stop-color="#0c2c49"/>
      <stop offset=".52" stop-color="#061a2f"/>
      <stop offset="1" stop-color="#030b15"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#59c8ff"/>
      <stop offset="1" stop-color="#1493ff"/>
    </linearGradient>
    <filter id="blueGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pinkGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#1493ff" stroke-opacity=".09" stroke-width="1"/>
      <path d="M40 0V80M0 40H80" fill="none" stroke="#1493ff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0l12 6-12 6z" fill="#1493ff"/>
    </marker>
    <marker id="arrowPink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0l12 6-12 6z" fill="#ff1493"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#sea)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="58" y="48" width="1484" height="804" rx="38" fill="none" stroke="#1493ff" stroke-opacity=".18" stroke-width="2"/>
  <rect x="84" y="74" width="1432" height="752" rx="28" fill="none" stroke="#1493ff" stroke-opacity=".09"/>

  <g opacity=".26" stroke="#59c8ff" fill="none">
    <path d="M140 712c178-58 264 68 438 5s268 54 438-6 258 45 444-15" stroke-width="2"/>
    <path d="M116 750c174-57 268 66 444 4s268 55 438-5 260 45 470-12" stroke-width="1"/>
    <path d="M126 786c190-52 274 59 448 1s271 47 444-8 261 37 461-14" stroke-width="1"/>
  </g>

  <g transform="translate(800 445)">
    <circle r="315" fill="#06111f" fill-opacity=".72" stroke="#1493ff" stroke-opacity=".28" stroke-width="2"/>
    <circle r="276" fill="none" stroke="#93ff14" stroke-opacity=".5" stroke-width="3" stroke-dasharray="8 14"/>
    <circle r="212" fill="none" stroke="#1493ff" stroke-opacity=".16"/>
    <circle r="132" fill="none" stroke="#1493ff" stroke-opacity=".12"/>
    <path d="M-356 0H356M0-356V356" stroke="#59c8ff" stroke-opacity=".25" stroke-width="2"/>
    <path d="M-276-276L276 276M-276 276L276-276" stroke="#59c8ff" stroke-opacity=".1"/>

    <g fill="#59c8ff" fill-opacity=".6">
      <path d="M0-340l7 15-7 15-7-15z"/>
      <path d="M340 0l-15 7-15-7 15-7z"/>
      <path d="M0 340l-7-15 7-15 7 15z"/>
      <path d="M-340 0l15-7 15 7-15 7z"/>
    </g>

    <path d="M0 0L230-153" stroke="#06111f" stroke-width="24" stroke-linecap="round"/>
    <path d="M0 0L230-153" stroke="url(#cyan)" stroke-width="11" stroke-linecap="round" marker-end="url(#arrowBlue)" filter="url(#blueGlow)"/>
    <path d="M0 0L153 230" stroke="#1493ff" stroke-opacity=".24" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
    <path d="M0 0L-230 153" stroke="#1493ff" stroke-opacity=".24" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
    <path d="M0 0L-153-230" stroke="#1493ff" stroke-opacity=".24" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

    <path d="M230-153L153 230-230 153-153-230Z" fill="none" stroke="#93ff14" stroke-opacity=".82" stroke-width="5" stroke-dasharray="7 12" filter="url(#blueGlow)"/>
    <path d="M226-184A276 276 0 0 0 122-248" fill="none" stroke="#ff1493" stroke-width="9" stroke-linecap="round" marker-end="url(#arrowPink)" filter="url(#pinkGlow)"/>

    <g filter="url(#pinkGlow)">
      <path d="M230-170l17 17-17 17-17-17z" fill="#ff1493" stroke="#ffd3ea" stroke-width="3"/>
    </g>
    <g fill="#93ff14" stroke="#06111f" stroke-width="4">
      <circle cx="153" cy="230" r="11"/>
      <circle cx="-230" cy="153" r="11"/>
      <circle cx="-153" cy="-230" r="11"/>
    </g>
    <circle r="15" fill="#e8f6ff" stroke="#1493ff" stroke-width="5" filter="url(#blueGlow)"/>
  </g>

  <g opacity=".42" fill="none" stroke="#1493ff">
    <circle cx="220" cy="205" r="62"/>
    <circle cx="220" cy="205" r="48" stroke-dasharray="4 8"/>
    <path d="M220 125v160M140 205h160"/>
    <circle cx="1380" cy="682" r="70"/>
    <circle cx="1380" cy="682" r="54" stroke-dasharray="4 8"/>
    <path d="M1380 594v176M1292 682h176"/>
  </g>
  <g fill="#93ff14" opacity=".65">
    <circle cx="145" cy="128" r="5"/>
    <circle cx="1470" cy="176" r="5"/>
    <circle cx="132" cy="812" r="4"/>
    <circle cx="1484" cy="772" r="4"/>
  </g>
</svg>
