<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020a14"/>
      <stop offset=".55" stop-color="#06172a"/>
      <stop offset="1" stop-color="#071020"/>
    </linearGradient>
    <linearGradient id="merge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1493ff"/>
      <stop offset=".48" stop-color="#18b2d4"/>
      <stop offset="1" stop-color="#dfff38"/>
    </linearGradient>
    <pattern id="blueprint" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#2d6284" stroke-opacity=".18"/>
      <circle cx="0" cy="0" r="2" fill="#1493ff" fill-opacity=".22"/>
    </pattern>
    <pattern id="hatch-blue" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(36)">
      <path d="M0 0V18" stroke="#1493ff" stroke-opacity=".82" stroke-width="5"/>
    </pattern>
    <pattern id="dots-green" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.5" fill="#dfff38" fill-opacity=".78"/>
    </pattern>
    <filter id="glow-blue" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-pink" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="sonar" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1493ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#1493ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#night)"/>
  <rect width="1600" height="900" fill="url(#blueprint)"/>
  <circle cx="1320" cy="135" r="340" fill="url(#sonar)"/>

