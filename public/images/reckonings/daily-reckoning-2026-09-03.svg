    <path d="M124 91C82 147 19 164-42 140" stroke="#93ff14" stroke-width="4" stroke-dasharray="8 12" />

    <g stroke="#1493ff" stroke-width="3">
      <rect x="-454" y="95" width="164" height="104" rx="12" fill="#071d31" />
      <rect x="-340" y="-259" width="168" height="108" rx="12" fill="#071d31" />
      <rect x="19" y="-355" width="168" height="108" rx="12" fill="#071d31" />
