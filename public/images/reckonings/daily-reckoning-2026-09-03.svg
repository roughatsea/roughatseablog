<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">An unfinished circuit of proofs on a maritime blueprint</title>
  <desc id="hero-desc">Neon proof cards spiral across a dark nautical grid. A magenta path escapes through a deliberate gap in a cyan ring while lime checkpoints continue beyond it.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020916" />
      <stop offset=".48" stop-color="#06182a" />
      <stop offset="1" stop-color="#02070f" />
    </linearGradient>
    <radialGradient id="blue-bloom" cx="48%" cy="44%" r="50%">
      <stop offset="0" stop-color="#1493ff" stop-opacity=".24" />
      <stop offset="1" stop-color="#1493ff" stop-opacity="0" />
    </radialGradient>
    <pattern id="minor-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1493ff" stroke-opacity=".07" stroke-width="1" />
    </pattern>
    <pattern id="major-grid" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#1493ff" stroke-opacity=".13" stroke-width="1.5" />
    </pattern>
    <filter id="blue-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="pink-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#ocean)" />
  <rect width="1600" height="900" fill="url(#blue-bloom)" />
  <rect x="54" y="48" width="1492" height="804" rx="34" fill="url(#minor-grid)" stroke="#1493ff" stroke-opacity=".3" stroke-width="2" />
  <rect x="54" y="48" width="1492" height="804" rx="34" fill="url(#major-grid)" />

  <g fill="none" stroke="#1493ff" stroke-opacity=".16" stroke-width="3">
    <path d="M0 755c130-46 236 49 366 3s235 52 365 4 237 50 367 2 237 48 372 0 212 6 260-5" />
    <path d="M0 793c130-46 236 49 366 3s235 52 365 4 237 50 367 2 237 48 372 0 212 6 260-5" />
    <path d="M0 831c130-46 236 49 366 3s235 52 365 4 237 50 367 2 237 48 372 0 212 6 260-5" />
  </g>

