    <path d="M-61 29h58M-61 49h38" stroke="#ff1493" stroke-width="5" stroke-linecap="round" />
  </g>

  <g fill="#1493ff" opacity=".42">
    <circle cx="104" cy="110" r="4" /><circle cx="1495" cy="118" r="4" />
    <circle cx="110" cy="695" r="4" /><circle cx="1490" cy="688" r="4" />
