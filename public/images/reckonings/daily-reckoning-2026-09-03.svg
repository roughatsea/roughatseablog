    <path d="M335 176C251 329 60 396-102 328" stroke="#1493ff" stroke-width="6" stroke-linecap="round" filter="url(#blue-glow)" />
    <path d="M-275 143C-395-59-192-268 35-234C204-209 297-51 247 91" stroke="#1493ff" stroke-opacity=".62" stroke-width="3" stroke-dasharray="13 13" />
