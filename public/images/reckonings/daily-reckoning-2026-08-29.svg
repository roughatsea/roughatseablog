<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Secant lines converging on a tangent</title>
  <desc id="desc">A luminous blue curve rises across a dark nautical plotting grid while magenta secant lines converge toward one acid-green tangent.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020912" />
      <stop offset="0.52" stop-color="#07182b" />
      <stop offset="1" stop-color="#030813" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0.35" cy="0.52" r="0.62">
      <stop offset="0" stop-color="#1493ff" stop-opacity="0.24" />
      <stop offset="1" stop-color="#1493ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pinkGlow" cx="0.7" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#ff1493" stop-opacity="0.2" />
      <stop offset="1" stop-color="#ff1493" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="minorGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#1493ff" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
    <pattern id="majorGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#minorGrid)" />
      <path d="M200 0H0v200" fill="none" stroke="#1493ff" stroke-opacity="0.16" stroke-width="1.5" />
    </pattern>
    <clipPath id="plotClip"><rect x="95" y="75" width="1410" height="710" rx="22" /></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#background)" />
  <rect width="1600" height="900" fill="url(#cyanGlow)" />
  <rect width="1600" height="900" fill="url(#pinkGlow)" />

  <g opacity="0.38" fill="none" stroke="#1493ff">
    <ellipse cx="800" cy="450" rx="650" ry="326" stroke-opacity="0.18" />
    <ellipse cx="800" cy="450" rx="510" ry="255" stroke-opacity="0.15" />
    <ellipse cx="800" cy="450" rx="370" ry="185" stroke-opacity="0.12" />
  </g>

  <rect x="95" y="75" width="1410" height="710" rx="22" fill="url(#majorGrid)" stroke="#1493ff" stroke-opacity="0.26" stroke-width="2" />

  <g clip-path="url(#plotClip)">
    <path d="M120 722H1490M278 760V92" fill="none" stroke="#c6d7e8" stroke-opacity="0.34" stroke-width="2" />

    <g fill="none" stroke="#ff1493" stroke-linecap="round">
      <path d="M185 755L1425 83" stroke-opacity="0.18" stroke-width="3" />
      <path d="M248 755L1365 101" stroke-opacity="0.26" stroke-width="3" />
      <path d="M306 755L1306 116" stroke-opacity="0.38" stroke-width="3.5" />
      <path d="M361 755L1249 131" stroke-opacity="0.58" stroke-width="4" />
      <path d="M412 755L1195 145" stroke-opacity="0.88" stroke-width="5" filter="url(#lineGlow)" />
    </g>

    <path
      d="M126 736C284 732 405 704 515 643C647 570 724 462 818 348C919 225 1057 137 1479 99"
      fill="none"
      stroke="#1493ff"
      stroke-linecap="round"
      stroke-width="13"
      filter="url(#softGlow)"
    />

    <path
      d="M470 755L1118 92"
      fill="none"
      stroke="#93ff14"
      stroke-linecap="round"
      stroke-width="8"
      filter="url(#lineGlow)"
    />

    <circle cx="815" cy="352" r="23" fill="#93ff14" fill-opacity="0.15" stroke="#93ff14" stroke-width="3" />
    <circle cx="815" cy="352" r="8" fill="#93ff14" filter="url(#lineGlow)" />
    <circle cx="1071" cy="128" r="8" fill="#ff1493" filter="url(#lineGlow)" />

    <g fill="none" stroke="#93ff14" stroke-opacity="0.35">
      <circle cx="815" cy="352" r="82" />
      <circle cx="815" cy="352" r="132" />
      <path d="M815 198v308M661 352h308" />
    </g>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M115 826c47 0 47-21 94-21s47 21 94 21 47-21 94-21 47 21 94 21 47-21 94-21 47 21 94 21 47-21 94-21 47 21 94 21 47-21 94-21 47 21 94 21 47-21 94-21 47 21 94 21 47-21 94-21 47 21 94 21 47-21 94-21" stroke="#1493ff" stroke-opacity="0.32" stroke-width="3" />
    <path d="M115 855c47 0 47-17 94-17s47 17 94 17 47-17 94-17 47 17 94 17 47-17 94-17 47 17 94 17 47-17 94-17 47 17 94 17 47-17 94-17 47 17 94 17 47-17 94-17 47 17 94 17 47-17 94-17 47 17 94 17 47-17 94-17" stroke="#ff1493" stroke-opacity="0.22" stroke-width="2" />
  </g>
</svg>
