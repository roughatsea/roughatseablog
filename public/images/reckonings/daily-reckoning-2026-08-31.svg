      <stop offset="0" stop-color="#020d19"/><stop offset="0.55" stop-color="#08213b"/><stop offset="1" stop-color="#160922"/>
    </linearGradient>
    <radialGradient id="glow" cx="53%" cy="49%" r="56%">
      <stop offset="0" stop-color="#1493ff" stop-opacity=".2"/><stop offset=".55" stop-color="#ff1493" stop-opacity=".07"/><stop offset="1" stop-color="#020914" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#1493ff" stroke-opacity=".09"/></pattern>
    <pattern id="waves" width="70" height="28" patternUnits="userSpaceOnUse"><path d="M0 15Q17 1 35 15T70 15" fill="none" stroke="#1493ff" stroke-opacity=".13" stroke-width="2"/></pattern>
    <filter id="blue-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
