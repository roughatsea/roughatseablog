<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Seven luminous bridges joining four land masses on a dark river chart</title>
  <desc id="desc">A blueprint-like midnight river map shows four islands and banks connected by seven glowing bridges, overlaid with a spare neon graph of their connections.</desc>
