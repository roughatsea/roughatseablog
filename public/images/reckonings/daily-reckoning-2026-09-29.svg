<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nested squares reveal a common measure</title>
  <desc id="desc">A long cyan-outlined rectangle on a dark maritime blueprint is divided into successively smaller magenta, blue, and acid-green squares. Contour lines below resemble waves and the final small squares glow near the right edge.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071727"/>
      <stop offset="1" stop-color="#020810"/>
    </linearGradient>
    <radialGradient id="flare" cx="78%" cy="47%" r="42%">
      <stop offset="0" stop-color="#93ff14" stop-opacity=".18"/>
      <stop offset=".36" stop-color="#1493ff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#020810" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#18415d" stroke-width="1" opacity=".42"/>
      <circle cx="0" cy="0" r="2" fill="#1493ff" opacity=".32"/>
    </pattern>
    <pattern id="pinkHatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#ff1493" stroke-width="3" opacity=".2"/>
    </pattern>
    <pattern id="blueHatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#1493ff" stroke-width="3" opacity=".22"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sea)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#flare)"/>

  <g fill="none" stroke="#1493ff" opacity=".19">
    <path d="M-60 742C148 660 306 804 521 730s383-61 567 8 366 54 572-31"/>
    <path d="M-70 775C132 696 309 833 517 765s383-63 568 4 363 53 580-29"/>
    <path d="M-82 810C121 729 312 866 522 799s378-59 563 3 365 51 588-31"/>
    <path d="M-93 846C120 763 307 901 521 834s381-57 566 1 365 49 592-34"/>
  </g>

  <g transform="translate(239 218)">
    <rect x="0" y="0" width="1122" height="484" rx="8" fill="#04111d" fill-opacity=".86" stroke="#1493ff" stroke-width="5"/>

    <rect x="0" y="0" width="484" height="484" fill="url(#pinkHatch)" stroke="#ff1493" stroke-width="7"/>
    <rect x="484" y="0" width="484" height="484" fill="url(#pinkHatch)" stroke="#ff1493" stroke-width="7"/>

    <rect x="968" y="0" width="154" height="154" fill="url(#blueHatch)" stroke="#1493ff" stroke-width="6" stroke-dasharray="18 10"/>
    <rect x="968" y="154" width="154" height="154" fill="url(#blueHatch)" stroke="#1493ff" stroke-width="6" stroke-dasharray="18 10"/>
    <rect x="968" y="308" width="154" height="154" fill="url(#blueHatch)" stroke="#1493ff" stroke-width="6" stroke-dasharray="18 10"/>

    <g transform="translate(968 462)" stroke="#93ff14" stroke-width="4" stroke-dasharray="3 8">
      <rect x="0" y="0" width="22" height="22" fill="#93ff14" fill-opacity=".12"/>
      <rect x="22" y="0" width="22" height="22" fill="#93ff14" fill-opacity=".12"/>
      <rect x="44" y="0" width="22" height="22" fill="#93ff14" fill-opacity=".12"/>
      <rect x="66" y="0" width="22" height="22" fill="#93ff14" fill-opacity=".12"/>
      <rect x="88" y="0" width="22" height="22" fill="#93ff14" fill-opacity=".12"/>
      <rect x="110" y="0" width="22" height="22" fill="#93ff14" fill-opacity=".12"/>
      <rect x="132" y="0" width="22" height="22" fill="#93ff14" fill-opacity=".12"/>
    </g>

  </g>

  <g filter="url(#glow)">
    <circle cx="1350" cy="691" r="8" fill="#93ff14"/>
    <path d="M1350 691l62-88" stroke="#93ff14" stroke-width="3" stroke-dasharray="5 9"/>
  </g>
  <circle cx="1280" cy="342" r="92" fill="#1493ff" opacity=".05" filter="url(#soft)"/>

  <g fill="none" stroke="#8bcfff" stroke-width="2" opacity=".5">
    <path d="M239 180h1122"/>
    <path d="M239 165v30M1361 165v30"/>
    <path d="M203 218v484"/>
    <path d="M189 218h30M189 702h30"/>
  </g>
</svg>
