<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Eigenvector directions in a transformed coordinate field</title>
  <desc id="desc">A dark maritime blueprint with a cyan grid transformed into slanted coordinates. Two diagonal green arrows remain aligned with longer dashed magenta images.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020b16"/>
      <stop offset="0.52" stop-color="#06192a"/>
      <stop offset="1" stop-color="#07101f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="56%">
      <stop offset="0" stop-color="#1493ff" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#00e5ff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#020b16" stop-opacity="0"/>
    </radialGradient>
    <pattern id="minorGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#285775" stroke-opacity=".19" stroke-width="1"/>
    </pattern>
    <pattern id="majorGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#54b8df" stroke-opacity=".17" stroke-width="2"/>
    </pattern>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="greenGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="cyanHead" markerWidth="15" markerHeight="15" refX="11" refY="7.5" orient="auto">
      <path d="M0 0L15 7.5L0 15Z" fill="#8ee9ff"/>
    </marker>
    <marker id="greenHead" markerWidth="15" markerHeight="15" refX="11" refY="7.5" orient="auto">
      <path d="M0 0L15 7.5L0 15Z" fill="#a8ff60"/>
    </marker>
    <marker id="pinkHead" markerWidth="15" markerHeight="15" refX="11" refY="7.5" orient="auto">
      <path d="M0 0L15 7.5L0 15Z" fill="#ff58c8"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#minorGrid)"/>
  <rect width="1600" height="900" fill="url(#majorGrid)"/>

  <g opacity=".2" fill="none" stroke="#1493ff">
    <circle cx="800" cy="450" r="330"/>
    <circle cx="800" cy="450" r="250"/>
    <circle cx="800" cy="450" r="170"/>
    <path d="M110 730C370 600 470 205 800 215s440 380 690 240"/>
    <path d="M90 760C400 645 480 270 800 280s420 330 710 245"/>
  </g>

  <g transform="translate(800 450) skewX(-18)" opacity=".58">
    <path d="M-620-300H620M-620-200H620M-620-100H620M-620 0H620M-620 100H620M-620 200H620M-620 300H620" stroke="#00e5ff" stroke-opacity=".32" stroke-width="2"/>
    <path d="M-600-330V330M-400-330V330M-200-330V330M0-330V330M200-330V330M400-330V330M600-330V330" stroke="#00e5ff" stroke-opacity=".26" stroke-width="2"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M190 710L1410 190" stroke="#8ee9ff" stroke-opacity=".32" stroke-width="5" stroke-dasharray="8 18"/>
    <path d="M245 180L1355 720" stroke="#8ee9ff" stroke-opacity=".23" stroke-width="5" stroke-dasharray="8 18"/>
    <path d="M800 450L1195 282" stroke="#a8ff60" stroke-width="14" marker-end="url(#greenHead)" filter="url(#greenGlow)"/>
    <path d="M800 450L1425 184" stroke="#ff58c8" stroke-width="11" stroke-dasharray="26 20" marker-end="url(#pinkHead)" filter="url(#cyanGlow)"/>
    <path d="M800 450L530 319" stroke="#8ee9ff" stroke-width="13" marker-end="url(#cyanHead)" filter="url(#cyanGlow)"/>
    <path d="M800 450L530 319" stroke="#ff58c8" stroke-width="7" stroke-dasharray="19 17" marker-end="url(#pinkHead)"/>
  </g>

  <g fill="#061726" stroke="#a8ff60" stroke-width="9" filter="url(#greenGlow)">
    <circle cx="800" cy="450" r="18"/>
    <circle cx="1195" cy="282" r="13"/>
    <circle cx="530" cy="319" r="13"/>
  </g>

  <g opacity=".7">
    <path d="M70 92H360M70 92V250" stroke="#8ee9ff" stroke-width="3"/>
    <path d="M1530 808H1240M1530 808V650" stroke="#ff58c8" stroke-width="3"/>
    <circle cx="70" cy="92" r="7" fill="#a8ff60"/>
    <circle cx="1530" cy="808" r="7" fill="#a8ff60"/>
  </g>
</svg>