<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">A fractal coastline measured at several scales</title>
  <desc id="description">A luminous recursive cyan coast divides a dark sea from a magenta landmass. Nested green measuring dividers and blueprint grid squares show that smaller rulers discover more coastline.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071b32" />
      <stop offset="1" stop-color="#020a14" />
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b0a36" />
      <stop offset="1" stop-color="#16091f" />
    </linearGradient>
    <pattern id="minorGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3c7298" stroke-opacity=".12" stroke-width="1" />
    </pattern>
    <pattern id="majorGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#minorGrid)" />
      <path d="M200 0H0V200" fill="none" stroke="#60a5d0" stroke-opacity=".18" stroke-width="2" />
    </pattern>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="landClip">
      <path d="M0 0H1600V155L1470 230L1395 188L1315 326L1248 290L1160 444L1088 405L1002 556L920 510L842 646L770 605L688 748L610 703L522 855L440 810L388 900H0Z" />
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#sea)" />
  <path d="M0 0H1600V155L1470 230L1395 188L1315 326L1248 290L1160 444L1088 405L1002 556L920 510L842 646L770 605L688 748L610 703L522 855L440 810L388 900H0Z" fill="url(#land)" />
  <rect width="1600" height="900" fill="url(#majorGrid)" />
  <g clip-path="url(#landClip)" opacity=".48">
    <path d="M-30 745C235 605 345 420 540 300S890 80 1195-25" fill="none" stroke="#ff1493" stroke-width="3" stroke-dasharray="10 18" />
    <path d="M80 845C310 690 450 565 625 430S955 190 1310 45" fill="none" stroke="#ff1493" stroke-opacity=".65" stroke-width="2" />
    <path d="M225 900C440 770 590 655 745 525S1040 300 1410 125" fill="none" stroke="#ff1493" stroke-opacity=".35" stroke-width="2" />
  </g>

  <path d="M1600 155L1470 230L1395 188L1315 326L1248 290L1160 444L1088 405L1002 556L920 510L842 646L770 605L688 748L610 703L522 855L440 810L388 900" fill="none" stroke="#1493ff" stroke-opacity=".28" stroke-width="24" filter="url(#cyanGlow)" />
  <path d="M1600 155L1470 230L1395 188L1315 326L1248 290L1160 444L1088 405L1002 556L920 510L842 646L770 605L688 748L610 703L522 855L440 810L388 900" fill="none" stroke="#62d8ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" />
  <path d="M1600 155L1470 230L1395 188L1315 326L1248 290L1160 444L1088 405L1002 556L920 510L842 646L770 605L688 748L610 703L522 855L440 810L388 900" fill="none" stroke="#fff" stroke-opacity=".7" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" />

  <g fill="none" stroke="#93ff14" filter="url(#softGlow)">
    <path d="M1170 135L1450 615" stroke-width="3" />
    <path d="M1142 151l56-32M1422 631l56-32" stroke-width="5" />
    <circle cx="1170" cy="135" r="9" fill="#071b32" stroke-width="3" />
    <circle cx="1450" cy="615" r="9" fill="#071b32" stroke-width="3" />
    <path d="M888 520l150 86M873 546l30-52M1023 632l30-52" stroke-width="3" />
    <circle cx="888" cy="520" r="7" fill="#071b32" stroke-width="2.5" />
    <circle cx="1038" cy="606" r="7" fill="#071b32" stroke-width="2.5" />
  </g>

  <g fill="none" stroke="#ff1493" stroke-width="3">
    <rect x="1140" y="245" width="100" height="100" opacity=".35" />
    <rect x="1240" y="245" width="100" height="100" opacity=".35" />
    <rect x="1240" y="345" width="100" height="100" opacity=".65" />
    <rect x="1340" y="345" width="100" height="100" opacity=".65" />
    <rect x="1240" y="445" width="100" height="100" opacity=".35" />
  </g>

  <g fill="#93ff14">
    <circle cx="1395" cy="188" r="6" />
    <circle cx="1248" cy="290" r="6" />
    <circle cx="1088" cy="405" r="6" />
    <circle cx="920" cy="510" r="6" />
    <circle cx="770" cy="605" r="6" />
    <circle cx="610" cy="703" r="6" />
  </g>

  <g fill="#62d8ff" opacity=".3">
    <circle cx="170" cy="155" r="2" /><circle cx="265" cy="230" r="2" /><circle cx="175" cy="330" r="2" />
    <circle cx="330" cy="510" r="2" /><circle cx="190" cy="665" r="2" /><circle cx="350" cy="755" r="2" />
    <circle cx="560" cy="105" r="2" /><circle cx="685" cy="210" r="2" /><circle cx="790" cy="135" r="2" />
  </g>
</svg>
