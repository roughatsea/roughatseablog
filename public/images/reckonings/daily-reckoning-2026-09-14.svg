<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Odd sine harmonics assembling a square wave</title>
  <desc id="desc">Three cyan and green sine waves flow from separate instrument channels into a luminous summing ring, then emerge as a magenta waveform with broad plateaus and steep sides on a dark maritime blueprint grid.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020b13"/>
      <stop offset=".52" stop-color="#071a2a"/>
      <stop offset="1" stop-color="#03101b"/>
    </linearGradient>
    <radialGradient id="halo" cx="70%" cy="50%" r="55%">
      <stop offset="0" stop-color="#ff1493" stop-opacity=".18"/>
      <stop offset=".52" stop-color="#1493ff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#03101b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="small-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1493ff" stroke-opacity=".065"/>
    </pattern>
    <pattern id="large-grid" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#1493ff" stroke-opacity=".11" stroke-width="1.5"/>
    </pattern>
    <filter id="blue-glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pink-glow" x="-15%" y="-30%" width="130%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1 1L10 6L1 11Z" fill="#93ff14"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#sea)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#small-grid)"/>
  <rect width="1600" height="900" fill="url(#large-grid)"/>

  <path d="M0 765C205 718 359 829 555 775C746 722 910 789 1089 756C1281 721 1412 746 1600 703V900H0Z" fill="#020912" opacity=".76"/>
  <path d="M0 765C205 718 359 829 555 775C746 722 910 789 1089 756C1281 721 1412 746 1600 703" fill="none" stroke="#1493ff" stroke-opacity=".18" stroke-width="3"/>

  <g opacity=".9">
    <rect x="76" y="112" width="480" height="174" rx="18" fill="#03101b" stroke="#3f6d89" stroke-opacity=".55"/>
    <rect x="76" y="363" width="480" height="174" rx="18" fill="#03101b" stroke="#3f6d89" stroke-opacity=".55"/>
    <rect x="76" y="614" width="480" height="174" rx="18" fill="#03101b" stroke="#3f6d89" stroke-opacity=".55"/>
    <path d="M116 199H516M116 450H516M116 701H516" stroke="#68859a" stroke-opacity=".45" stroke-dasharray="5 10"/>
    <path d="M116 199C149 116 183 116 216 199S283 282 316 199S383 116 416 199S483 282 516 199" fill="none" stroke="#1493ff" stroke-width="7" filter="url(#blue-glow)"/>
    <path d="M116 450C127 411 138 411 149 450S171 489 182 450S204 411 215 450S237 489 248 450S270 411 281 450S303 489 314 450S336 411 347 450S369 489 380 450S402 411 413 450S435 489 446 450S468 411 479 450S501 489 512 450" fill="none" stroke="#93ff14" stroke-width="5" filter="url(#blue-glow)"/>
    <path d="M116 701C123 676 130 676 137 701S151 726 158 701S172 676 179 701S193 726 200 701S214 676 221 701S235 726 242 701S256 676 263 701S277 726 284 701S298 676 305 701S319 726 326 701S340 676 347 701S361 726 368 701S382 676 389 701S403 726 410 701S424 676 431 701S445 726 452 701S466 676 473 701S487 726 494 701S508 676 515 701" fill="none" stroke="#ffcf33" stroke-width="4" filter="url(#blue-glow)"/>
    <g fill="#d8eaf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700">
      <text x="101" y="154">n = 1</text>
      <text x="101" y="405">n = 3</text>
      <text x="101" y="656">n = 5</text>
    </g>
    <g fill="#7898ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">
      <text x="457" y="154">4/π</text>
      <text x="434" y="405">4/(3π)</text>
      <text x="434" y="656">4/(5π)</text>
    </g>
  </g>

  <g fill="none" stroke="#93ff14" stroke-width="4" stroke-opacity=".74" marker-end="url(#arrow)">
    <path d="M556 199C630 199 621 359 684 413"/>
    <path d="M556 450H671"/>
    <path d="M556 701C630 701 621 541 684 487"/>
  </g>
  <circle cx="708" cy="450" r="70" fill="#061421" stroke="#eaf6ff" stroke-width="3" filter="url(#blue-glow)"/>
  <circle cx="708" cy="450" r="55" fill="none" stroke="#1493ff" stroke-opacity=".48" stroke-dasharray="6 9"/>
  <path d="M678 450H738M708 420V480" stroke="#93ff14" stroke-width="8" stroke-linecap="round"/>

