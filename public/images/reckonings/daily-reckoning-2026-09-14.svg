    <path d="M760 450H1480M1120 169V731" stroke="#58788e" stroke-opacity=".38"/>
    <path d="M760 575H1120M1120 325H1480" fill="none" stroke="#1493ff" stroke-width="5" stroke-dasharray="12 12" opacity=".68"/>
    <path d="M760.0 450.0 L767.5 481.0 L775.0 510.5 L782.5 537.0 L790.0 559.5 L797.5 577.0 L805.0 589.3 L812.5 596.4 L820.0 598.5 L827.5 596.7 L835.0 591.7 L842.5 585.0 L850.0 577.5 L857.5 570.6 L865.0 565.0 L872.5 561.5 L880.0 560.3 L887.5 561.4 L895.0 564.6 L902.5 569.2 L910.0 574.5 L917.5 579.7 L925.0 584.0 L932.5 586.9 L940.0 587.9 L947.5 586.9 L955.0 584.0 L962.5 579.7 L970.0 574.5 L977.5 569.2 L985.0 564.6 L992.5 561.4 L1000.0 560.3 L1007.5 561.5 L1015.0 565.0 L1022.5 570.6 L1030.0 577.5 L1037.5 585.0 L1045.0 591.7 L1052.5 596.7 L1060.0 598.5 L1067.5 596.4 L1075.0 589.3 L1082.5 577.0 L1090.0 559.5 L1097.5 537.0 L1105.0 510.5 L1112.5 481.0 L1120.0 450.0 L1127.5 419.0 L1135.0 389.5 L1142.5 363.0 L1150.0 340.5 L1157.5 323.0 L1165.0 310.7 L1172.5 303.6 L1180.0 301.5 L1187.5 303.3 L1195.0 308.3 L1202.5 315.0 L1210.0 322.5 L1217.5 329.4 L1225.0 335.0 L1232.5 338.5 L1240.0 339.7 L1247.5 338.6 L1255.0 335.4 L1262.5 330.8 L1270.0 325.5 L1277.5 320.3 L1285.0 316.0 L1292.5 313.1 L1300.0 312.1 L1307.5 313.1 L1315.0 316.0 L1322.5 320.3 L1330.0 325.5 L1337.5 330.8 L1345.0 335.4 L1352.5 338.6 L1360.0 339.7 L1367.5 338.5 L1375.0 335.0 L1382.5 329.4 L1390.0 322.5 L1397.5 315.0 L1405.0 308.3 L1412.5 303.3 L1420.0 301.5 L1427.5 303.6 L1435.0 310.7 L1442.5 323.0 L1450.0 340.5 L1457.5 363.0 L1465.0 389.5 L1472.5 419.0 L1480.0 450.0" fill="none" stroke="#ff1493" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#pink-glow)"/>
    <g fill="#eaf6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">
      <text x="797" y="217">−π</text>
      <text x="1108" y="217">0</text>
      <text x="1432" y="217">π</text>
    </g>
    <g transform="translate(782 688)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#1493ff" stroke-width="4" stroke-dasharray="9 7"/>
      <circle cx="91" cy="0" r="5" fill="#ff1493"/>
      <line x1="112" y1="0" x2="172" y2="0" stroke="#ff1493" stroke-width="5"/>
    </g>
  </g>

  <g fill="none" stroke="#eaf6ff" stroke-opacity=".16">
    <circle cx="708" cy="450" r="95"/>
    <circle cx="708" cy="450" r="112" stroke-dasharray="3 12"/>
    <path d="M708 320V252M708 648V580"/>
  </g>
</svg>
