      <rect x="169" y="468" width="45" height="52" rx="3"/>
      <rect x="226" y="420" width="45" height="100" rx="3"/>
      <rect x="283" y="348" width="45" height="172" rx="3"/>
      <rect x="340" y="258" width="45" height="262" rx="3"/>
      <rect x="397" y="184" width="45" height="336" rx="3"/>
      <rect x="454" y="154" width="45" height="366" rx="3"/>
      <rect x="511" y="184" width="45" height="336" rx="3"/>
      <rect x="568" y="258" width="45" height="262" rx="3"/>
      <rect x="625" y="348" width="45" height="172" rx="3"/>
      <rect x="682" y="420" width="45" height="100" rx="3"/>
      <rect x="739" y="468" width="45" height="52" rx="3"/>
      <rect x="796" y="494" width="45" height="26" rx="3"/>
    </g>
    <path d="M92 513C186 503 250 448 312 342C370 243 406 140 476 130C546 140 582 243 640 342C702 448 766 503 860 513" fill="none" stroke="#93ff14" stroke-width="8" stroke-linecap="round" filter="url(#green-glow)"/>
    <path d="M92 513C186 503 250 448 312 342C370 243 406 140 476 130C546 140 582 243 640 342C702 448 766 503 860 513" fill="none" stroke="#e8ffd0" stroke-width="2" stroke-linecap="round"/>
    <path d="M476 112V520" fill="none" stroke="#1493ff" stroke-dasharray="8 13" stroke-opacity="0.72" stroke-width="3"/>
    <g fill="#1493ff">
      <circle cx="476" cy="112" r="8"/><circle cx="476" cy="520" r="8"/>
    </g>
  </g>

  <g fill="none" stroke="#d9f5ff" stroke-opacity="0.19" stroke-width="2">
    <circle cx="1080" cy="459" r="286"/>
    <circle cx="1080" cy="459" r="316"/>
    <path d="M1080 103V815M724 459h712"/>
  </g>
</svg>
