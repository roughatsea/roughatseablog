<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A three-colored trefoil knot on a dark maritime blueprint</title>
  <desc id="desc">A luminous trefoil knot rises above dark ocean-contour lines. Cyan, magenta, and acid-green arcs cross with small gaps that identify the underpassing strands, while faint modular arithmetic marks suggest a topological proof.</desc>
