    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="52%">
      <stop offset="0" stop-color="#1493ff" stop-opacity=".22"/><stop offset=".48" stop-color="#ff1493" stop-opacity=".08"/><stop offset="1" stop-color="#020810" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#58c9f8" stroke-opacity=".08"/><circle cx="0" cy="0" r="2" fill="#93ff14" fill-opacity=".14"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
