<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020a14"/>
      <stop offset="0.55" stop-color="#06172a"/>
      <stop offset="1" stop-color="#071020"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1493ff"/>
      <stop offset="0.54" stop-color="#10bce6"/>
      <stop offset="1" stop-color="#93ff14"/>
    </linearGradient>
    <pattern id="blueprint" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#2d6284" stroke-opacity=".18" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="#1493ff" fill-opacity=".22"/>
