    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0V18" stroke="#93ff14" stroke-opacity=".58" stroke-width="4"/>
    </pattern>
    <filter id="glow-blue" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-pink" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="sonar" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1493ff" stop-opacity=".17"/>
      <stop offset="1" stop-color="#1493ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

