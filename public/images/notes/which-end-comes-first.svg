<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Which end comes first?</title><desc id="desc">0x12345678 in big-endian and little-endian memory order at increasing addresses.</desc><rect width="1200" height="675" fill="#101c30"/><g font-family="Arial, sans-serif"><text x="64" y="68" fill="#66dbff" font-size="20" letter-spacing="4">ROUGH AT SEA / COMPUTER SCIENCE</text><text x="64" y="137" fill="#fff7e9" font-size="52" font-weight="700">Which end comes first?</text><text x="64" y="187" fill="#b9c8dc" font-size="26">One integer. Two byte orders.</text><text x="64" y="270" fill="#fff7e9" font-size="36" font-family="monospace">0x12345678</text><text x="64" y="372" fill="#fff7e9" font-size="26">Big-endian</text><rect x="350" y="320" width="146" height="78" rx="12" fill="#ff5cad"/><text x="423" y="372" text-anchor="middle" fill="#101c30" font-family="monospace" font-size="40" font-weight="700">12</text><text x="423" y="302" text-anchor="middle" fill="#b9c8dc" font-size="19">A + 0</text><rect x="525" y="320" width="146" height="78" rx="12" fill="#66dbff"/><text x="598" y="372" text-anchor="middle" fill="#101c30" font-family="monospace" font-size="40" font-weight="700">34</text><text x="598" y="302" text-anchor="middle" fill="#b9c8dc" font-size="19">A + 1</text><rect x="700" y="320" width="146" height="78" rx="12" fill="#c3f55c"/><text x="773" y="372" text-anchor="middle" fill="#101c30" font-family="monospace" font-size="40" font-weight="700">56</text><text x="773" y="302" text-anchor="middle" fill="#b9c8dc" font-size="19">A + 2</text><rect x="875" y="320" width="146" height="78" rx="12" fill="#ffc56e"/><text x="948" y="372" text-anchor="middle" fill="#101c30" font-family="monospace" font-size="40" font-weight="700">78</text><text x="948" y="302" text-anchor="middle" fill="#b9c8dc" font-size="19">A + 3</text><text x="64" y="508" fill="#fff7e9" font-size="26">Little-endian</text><rect x="350" y="456" width="146" height="78" rx="12" fill="#ffc56e"/><text x="423" y="508" text-anchor="middle" fill="#101c30" font-family="monospace" font-size="40" font-weight="700">78</text><rect x="525" y="456" width="146" height="78" rx="12" fill="#c3f55c"/><text x="598" y="508" text-anchor="middle" fill="#101c30" font-family="monospace" font-size="40" font-weight="700">56</text><rect x="700" y="456" width="146" height="78" rx="12" fill="#66dbff"/><text x="773" y="508" text-anchor="middle" fill="#101c30" font-family="monospace" font-size="40" font-weight="700">34</text><rect x="875" y="456" width="146" height="78" rx="12" fill="#ff5cad"/><text x="948" y="508" text-anchor="middle" fill="#101c30" font-family="monospace" font-size="40" font-weight="700">12</text><text x="350" y="587" fill="#b9c8dc" font-size="21">Addresses increase from left to right</text></g></svg>