<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How near is the singularity?</title>
  <desc id="desc">The starting positions in a six-turn debate: Ad Astra considers a singularity likely by September 2036; Pedes in Terram considers it unlikely. Both must provide sources and may change their positions.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#101629"/><stop offset="1" stop-color="#080e18"/></linearGradient>
    <linearGradient id="astra" x2="1" y2="1"><stop stop-color="#19254c"/><stop offset="1" stop-color="#171e32"/></linearGradient>
    <linearGradient id="terram" x2="1" y2="1"><stop stop-color="#243b32"/><stop offset="1" stop-color="#182a26"/></linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#8eaaff" stroke-width="2"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b8ee9b" stroke-width="2"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <g fill="none" stroke="#456488" opacity=".2" stroke-width="2">
    <path d="M-60 790Q140 730 340 790T740 790T1140 790T1540 790T1940 790"/>
    <path d="M-60 830Q140 770 340 830T740 830T1140 830T1540 830T1940 830"/>
    <path d="M-60 870Q140 810 340 870T740 870T1140 870T1540 870T1940 870"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="100" y="98" fill="#9eb7ce" font-size="24" letter-spacing="4">ROUGH AT SEA / AN EXPERIMENT IN PERSUASION</text>
    <text x="100" y="211" fill="#f7f1e7" font-size="78" font-weight="700">How near is the singularity?</text>
    <text x="100" y="293" fill="#b5c2d4" font-size="28">Two starting convictions. One shared question. Permission to reconsider.</text>
    <text x="100" y="369" fill="#8d9bb0" font-size="20" letter-spacing="4">ASSIGNED STARTING POSITIONS</text>
    <rect x="100" y="400" width="605" height="292" rx="16" fill="url(#astra)" stroke="#8eaaff" stroke-width="2"/>
    <rect x="895" y="400" width="605" height="292" rx="16" fill="url(#terram)" stroke="#b8ee9b" stroke-width="2"/>
    <text x="140" y="471" fill="#8eaaff" font-size="26" letter-spacing="5">AD ASTRA</text>
    <text x="140" y="553" fill="#f7f1e7" font-size="47" font-weight="700">Likely by</text>
    <text x="140" y="619" fill="#f7f1e7" font-size="47" font-weight="700">September 2036.</text>
    <text x="935" y="471" fill="#b8ee9b" font-size="26" letter-spacing="4">PEDES IN TERRAM</text>
    <text x="935" y="553" fill="#f7f1e7" font-size="47" font-weight="700">Unlikely by</text>
    <text x="935" y="619" fill="#f7f1e7" font-size="47" font-weight="700">September 2036.</text>
    <path d="M744 513H851" fill="none" stroke="#8eaaff" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M854 585H747" fill="none" stroke="#b8ee9b" stroke-width="3" marker-end="url(#arrow-green)"/>
    <text x="800" y="797" text-anchor="middle" fill="#d1d9e4" font-size="27" letter-spacing="2">SIX TURNS · SOURCES REQUIRED · NO SCRIPTED WINNER</text>
  </g>
</svg>
