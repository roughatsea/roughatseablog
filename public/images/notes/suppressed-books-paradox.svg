<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="686" viewBox="0 0 1600 686" role="img" aria-labelledby="title desc">
  <title id="title">Part I: The Paradox of Banned Books</title>
  <desc id="desc">A legal injunction, redacted pages, and a moonlit archive surround the title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070707"/><stop offset=".58" stop-color="#17100d"/><stop offset="1" stop-color="#061823"/></linearGradient>
    <linearGradient id="paper"><stop stop-color="#d8c095"/><stop offset="1" stop-color="#876744"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0d2a0"/><stop offset=".5" stop-color="#a9793f"/><stop offset="1" stop-color="#e1bd80"/></linearGradient>
    <pattern id="dust" width="55" height="55" patternUnits="userSpaceOnUse"><circle cx="8" cy="11" r="1" fill="#fff" opacity=".04"/><circle cx="39" cy="31" r="1.4" fill="#000" opacity=".18"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".7"/></filter>
  </defs>
  <rect width="1600" height="686" fill="url(#bg)"/><rect width="1600" height="686" fill="url(#dust)"/>
  <g opacity=".72" fill="#1f1510" stroke="#5a3b27" stroke-width="3">
    <rect x="0" y="0" width="290" height="520" fill="#080706"/>
    <rect x="20" y="45" width="42" height="150"/><rect x="68" y="76" width="33" height="119"/><rect x="108" y="52" width="45" height="143"/><rect x="161" y="88" width="37" height="107"/><rect x="206" y="61" width="49" height="134"/>
    <rect x="20" y="230" width="38" height="148"/><rect x="65" y="254" width="49" height="124"/><rect x="121" y="222" width="31" height="156"/><rect x="159" y="246" width="43" height="132"/><rect x="210" y="237" width="47" height="141"/>
  </g>
  <g transform="translate(90 270) rotate(-7)" filter="url(#shadow)">
