    <text x="147" y="46" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#352318">IN THE SUPREME COURT</text>
    <text x="147" y="94" text-anchor="middle" font-family="Georgia,serif" font-size="37" font-weight="700" fill="#25170f">INJUNCTION</text>
    <path d="M33 124h225M33 148h225M33 172h187M33 211h225M33 235h201M33 259h225" stroke="#4d3523" stroke-width="5" opacity=".55"/>
    <g transform="translate(66 272) rotate(-3)"><rect width="164" height="43" fill="none" stroke="#7c2226" stroke-width="4"/><text x="82" y="31" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#7c2226">RESTRAINED</text></g>
  </g>
