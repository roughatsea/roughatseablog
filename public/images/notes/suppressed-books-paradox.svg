  <text x="780" y="521" text-anchor="middle" font-family="Georgia,serif" font-size="25" font-style="italic" fill="#c7ab7d">The famous survivors are usually the failed suppressions.</text>
  <rect x="20" y="20" width="1560" height="646" rx="22" fill="none" stroke="#b8884b" stroke-width="2" opacity=".38"/>
