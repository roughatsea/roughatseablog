  <circle cx="815" cy="115" r="6"/><circle cx="1040" cy="180" r="7"/><circle cx="1260" cy="190" r="6"/><circle cx="1470" cy="120" r="8"/>
  <circle cx="180" cy="300" r="5"/><circle cx="430" cy="325" r="7"/><circle cx="620" cy="285" r="6"/>
  <circle cx="870" cy="250" r="6"/><circle cx="1070" cy="310" r="7"/><circle cx="1320" cy="350" r="5"/><circle cx="1440" cy="300" r="7"/>
</g>
<g font-family="system-ui, sans-serif" font-size="28" fill="#d7f4ff" opacity=".9">
  <text x="115" y="110">curiosity</text>
  <text x="520" y="105">competence</text>
  <text x="975" y="115">autonomy</text>
  <text x="1280" y="105">connection</text>
</g>
