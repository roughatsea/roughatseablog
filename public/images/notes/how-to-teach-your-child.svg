<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">A parent and child exploring ideas together</title>
<desc id="desc">A warm illustrated study table with a parent and child building, reading, observing, and experimenting together beneath constellations of scientific ideas.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#071525"/>
    <stop offset="55%" stop-color="#10263d"/>
    <stop offset="100%" stop-color="#1b3851"/>
  </linearGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8f5a3a"/>
    <stop offset="100%" stop-color="#c58250"/>
  </linearGradient>
  <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffd98b" stop-opacity=".8"/>
    <stop offset="100%" stop-color="#ffd98b" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="800" cy="430" r="360" fill="url(#lamp)"/>
<g fill="none" stroke="#78d7ff" stroke-width="3" opacity=".7">
  <path d="M130 170 C310 90 430 240 590 150 S900 95 1040 180 1310 215 1470 120"/>
  <path d="M180 300 C340 250 470 360 620 285 S910 235 1070 310 1310 365 1440 300"/>
</g>
