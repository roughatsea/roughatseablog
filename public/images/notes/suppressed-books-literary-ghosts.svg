<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="686" viewBox="0 0 1600 686" role="img" aria-labelledby="title desc">
  <title id="title">Part IV: How to Research Literary Ghosts</title>
  <desc id="desc">A magnifying glass, catalog cards, publisher correspondence, and an evidence map trace a book that never reached readers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070706"/><stop offset=".56" stop-color="#17100d"/><stop offset="1" stop-color="#061720"/></linearGradient>
    <linearGradient id="paper"><stop stop-color="#d7bf94"/><stop offset="1" stop-color="#846442"/></linearGradient>
    <linearGradient id="gold"><stop stop-color="#f1d5a3"/><stop offset=".5" stop-color="#aa793d"/><stop offset="1" stop-color="#e2bf82"/></linearGradient>
    <pattern id="grain" width="67" height="67" patternUnits="userSpaceOnUse"><circle cx="9" cy="12" r="1" fill="#fff" opacity=".035"/><circle cx="46" cy="39" r="1.4" fill="#000" opacity=".17"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="11" stdDeviation="13" flood-opacity=".75"/></filter>
  </defs>
  <rect width="1600" height="686" fill="url(#bg)"/><rect width="1600" height="686" fill="url(#grain)"/>
  <path d="M0 518Q405 478 805 512t795-8v182H0Z" fill="#150d09"/>
  <!-- catalog and magnifier -->
  <g transform="translate(45 270)" filter="url(#shadow)">
    <rect x="0" y="170" width="385" height="185" fill="#4a321f" stroke="#875f39" stroke-width="5"/>
    <rect x="78" y="218" width="230" height="64" fill="#b99d70"/><text x="193" y="245" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#372417">UNRECOVERED WORKS</text><text x="193" y="269" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#372417">INDEX</text>
    <g fill="#c6aa7b" stroke="#5d4027" stroke-width="3"><rect x="23" y="42" width="330" height="160" rx="5"/><rect x="34" y="27" width="308" height="160" rx="5"/><rect x="45" y="12" width="286" height="160" rx="5"/></g>
    <text x="65" y="48" font-family="Courier New,monospace" font-size="15" fill="#382417">TITLE: THE LAST LIBRARY</text><text x="65" y="76" font-family="Courier New,monospace" font-size="15" fill="#382417">AUTHOR: UNKNOWN</text><text x="65" y="104" font-family="Courier New,monospace" font-size="15" fill="#382417">STATUS: UNPUBLISHED</text><text x="65" y="132" font-family="Courier New,monospace" font-size="15" fill="#762126">LOCATION: NOT FOUND</text>
    <circle cx="175" cy="89" r="105" fill="#0b1820" fill-opacity=".2" stroke="#c49a5d" stroke-width="13"/><path d="M246 166l117 124" stroke="#8c653e" stroke-width="26" stroke-linecap="round"/><path d="M246 166l117 124" stroke="#c39a60" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- evidence map -->
  <g transform="translate(1190 100) rotate(3)" filter="url(#shadow)">
    <rect width="350" height="390" rx="6" fill="url(#paper)" stroke="#5a3b22" stroke-width="4"/>
    <text x="175" y="38" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#352318">THE TRAIL OF A LOST BOOK</text>
    <g stroke="#762128" stroke-width="3" opacity=".72"><path d="M70 105L175 175 285 92M175 175l-80 111m80-111 95 111M95 286l175 0"/></g>
    <g fill="#6c2027" stroke="#b27860" stroke-width="2"><circle cx="70" cy="105" r="9"/><circle cx="285" cy="92" r="9"/><circle cx="175" cy="175" r="10"/><circle cx="95" cy="286" r="9"/><circle cx="270" cy="286" r="9"/></g>
    <g font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#342217"><text x="26" y="82">PUBLISHER</text><text x="249" y="70">AGENT</text><text x="140" y="153">COURT FILE</text><text x="45" y="320">ARCHIVE</text><text x="233" y="320">PROOF COPY</text></g>
    <g transform="translate(99 338) rotate(-3)"><rect width="160" height="42" fill="none" stroke="#762126" stroke-width="4"/><text x="80" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#762126">NOT FOUND</text></g>
  </g>
  <!-- notes -->
  <g transform="translate(870 497) rotate(-2)" filter="url(#shadow)"><rect width="300" height="160" rx="5" fill="#c5a979" stroke="#5c3f27" stroke-width="4"/><text x="25" y="35" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#352318">LEADS</text><g font-family="Courier New,monospace" font-size="15" fill="#382417"><text x="28" y="65">☑ publisher ledger</text><text x="28" y="91">☑ court docket</text><text x="28" y="117">☐ surviving proof</text><text x="28" y="143">☐ author's papers</text></g></g>
  <!-- fragments -->
  <g transform="translate(1128 520)" opacity=".78"><path d="M0 80l44-74 28 60 39-51 31 73 43-65 35 83" fill="none" stroke="#b69868" stroke-width="10"/><path d="M18 111l55-65 37 65 53-62 41 73" fill="none" stroke="#765c3c" stroke-width="8"/></g>
  <!-- title -->
  <g filter="url(#shadow)">
    <rect x="386" y="62" width="825" height="411" rx="18" fill="#0b0a09" fill-opacity=".93" stroke="#8d683b" stroke-width="3"/>
    <path d="M448 124h701M448 415h701" stroke="#a57a43" stroke-width="2" opacity=".76"/>
    <text x="798" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="6" fill="#9d7543">PART IV</text>
    <text x="798" y="260" text-anchor="middle" font-family="Georgia,serif" font-size="70" fill="url(#gold)">How to Research</text>
    <text x="798" y="355" text-anchor="middle" font-family="Georgia,serif" font-size="70" fill="url(#gold)">Literary Ghosts</text>
  </g>
  <text x="798" y="516" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-style="italic" fill="#c8ad80">Successful suppression survives only as evidence of an absence.</text>
  <rect x="20" y="20" width="1560" height="646" rx="22" fill="none" stroke="#b8884b" stroke-width="2" opacity=".38"/>
</svg>